name: build

on:
  workflow_dispatch:        # manual run -> uploads artifacts only (for testing)
  push:
    tags: ['v*']            # tag push -> also attaches binaries to the GitHub Release

permissions:
  contents: write           # needed to upload release assets

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - name: Build CLI
        run: pyinstaller --onefile --console --name claude-code-export-import-cli-win-x64 claude_session_port.py
      - name: Build GUI
        run: pyinstaller --onefile --windowed --name claude-code-export-import-gui-win-x64 gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.exe --clobber

  macos:
    runs-on: macos-14   # Apple Silicon runner (fast); builds a universal2 binary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - name: Build GUI (.app, universal2 = Intel + Apple Silicon)
        run: pyinstaller --windowed --target-arch universal2 --name claude-code-export-import-gui gui.py
      - name: Build CLI (universal2)
        run: pyinstaller --onefile --console --target-arch universal2 --name claude-code-export-import-cli-macos-universal claude_session_port.py
      - name: Zip the .app
        run: |
          cd dist
          zip -r -y "claude-code-export-import-gui-macos-universal.zip" "claude-code-export-import-gui.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            dist/claude-code-export-import-gui-macos-universal.zip
            dist/claude-code-export-import-cli-macos-universal
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/claude-code-export-import-gui-macos-universal.zip" \
            "dist/claude-code-export-import-cli-macos-universal" --clobber
